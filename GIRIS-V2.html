<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>COIN ARENA</title><style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,#0f172a,#1e1b4b,#0f172a);color:white;padding:16px}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#1e293b;width:100%;max-width:420px;padding:28px;border-radius:20px;text-align:center;border:1px solid #334155}
.odul{background:#dc2626;color:white;font-size:22px;font-weight:900;padding:12px 8px;border-radius:12px;margin-bottom:18px}
h1{margin:0 0 20px;font-size:34px;letter-spacing:2px;color:#facc15}
input{width:100%;padding:13px;border-radius:12px;border:1px solid #475569;background:#0f172a;color:white;margin-bottom:12px;font-size:15px}
button{width:100%;padding:13px;border:none;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer;margin-bottom:10px}
.kayit{background:#facc15;color:#111}.giris{background:#22c55e;color:white}
#mesaj{min-height:22px;font-size:14px;color:#fda4af}
header{display:flex;justify-content:space-between;align-items:center;max-width:800px;margin:0 auto 20px}
.bakiye{background:#22c55e;color:white;padding:10px 16px;border-radius:20px;font-weight:bold}
.wrap{max-width:800px;margin:0 auto;text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.wheelbtn{background:#1e293b;border:2px solid #facc15;border-radius:18px;padding:20px 10px;cursor:pointer;text-decoration:none;color:white;display:block}
.wheelbtn .emoji{font-size:44px}.wheelbtn .fiyat{font-size:22px;font-weight:900;color:#facc15;margin-top:8px}.wheelbtn small{color:#cbd5e1}
.wheelpage{max-width:480px;margin:0 auto;text-align:center}
.bigwheel{font-size:110px;margin:10px 0}
.cev{background:#facc15;color:#111;font-size:20px;padding:16px}
.geri{background:#334155;color:white}
.odultablo{background:#0f172a;border:1px solid #334155;border-radius:12px;padding:12px;margin:12px 0}
</style></head>
<body><div class="center"><div class="card">
<div class="odul">KAYIT ÖDÜLÜ 100 COIN - V2 YENİ</div><h1>COIN ARENA</h1><div style="background:#22c55e;color:white;padding:6px;border-radius:8px;font-size:13px;margin-bottom:12px">V2 - YENİ DOSYA - ESKİ DEĞİL</div>
<input id="ad" placeholder="Kullanici Adi"><input id="sifre" type="password" placeholder="Sifre">
<button class="kayit" onclick="kayit()">KAYIT OL</button><button class="giris" onclick="giris()">GIRIS YAP</button>
<div id="mesaj"></div></div></div>
<script>
function oku(){try{return JSON.parse(localStorage.getItem('coin_users')||'{}')}catch(e){return {}}}
function yaz(d){localStorage.setItem('coin_users',JSON.stringify(d))}
function kayit(){var ad=document.getElementById('ad').value.trim();var sifre=document.getElementById('sifre').value;var m=document.getElementById('mesaj');if(!ad||!sifre){m.textContent='Kullanici adi ve sifre bos olamaz';return;}var u=oku();if(u[ad]){m.textContent='Bu kullanici zaten var, Giris Yap dene';return;}u[ad]={sifre:sifre,bakiye:100,engelli:false};yaz(u);localStorage.setItem('coin_aktif',ad);m.style.color='#86efac';m.textContent='Kayit basarili! Bakiyen: 100 coin';setTimeout(function(){location.href='anasayfa.html'},600);}
function giris(){var ad=document.getElementById('ad').value.trim();var sifre=document.getElementById('sifre').value;var m=document.getElementById('mesaj');if(ad==='admin'&&sifre==='admin123'){m.style.color='#86efac';m.textContent='Admin girisi basarili';return;}var u=oku();if(!u[ad]){m.textContent='Boyle bir kullanici yok, once Kayit Ol';return;}if(u[ad].sifre!==sifre){m.textContent='Hatali sifre';return;}if(u[ad].engelli){m.textContent='Hesabin engelli';return;}localStorage.setItem('coin_aktif',ad);location.href='anasayfa.html';}
</script></body></html>
