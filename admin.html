<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin Paneli - Sadece Admin</title><style>
*{box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#1e1b4b,#0f172a);color:white;padding:16px}.wrap{max-width:620px;margin:0 auto}.card{background:#1e293b;border-radius:22px;padding:18px;border:2px solid #334155;margin-top:12px}.bakim{width:100%;padding:16px;border:none;border-radius:16px;font-weight:900;font-size:18px;cursor:pointer}.bakim.aktif{background:#22c55e;color:white}.bakim.bakimda{background:#ef4444;color:white}.menubtn{width:100%;padding:14px;border:none;border-radius:14px;font-weight:900;font-size:16px;cursor:pointer;margin-top:10px;background:#facc15;color:#111}.menubtn2{background:#7ee8a2}.menubtn3{background:#e9d5ff}.bolum{display:none}.bolum.acik{display:block}.kullanici{background:#0f172a;border:1px solid #334155;border-radius:14px;padding:12px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.nokta{width:12px;height:12px;border-radius:50%;display:inline-block}.nokta.yesil{background:#22c55e;box-shadow:0 0 8px #22c55e}.nokta.kirmizi{background:#ef4444}.kucukbtn{padding:8px 12px;border:none;border-radius:10px;font-weight:800;cursor:pointer;margin:2px}.ekle{background:#22c55e;color:white}.cikar{background:#ef4444;color:white}.onayla{background:#22c55e;color:white}.reddet{background:#ef4444;color:white}input{width:100%;padding:12px;border-radius:12px;border:1px solid #475569;background:#0f172a;color:white;margin-top:8px}.mesaj{background:#0f172a;border:1px solid #334155;border-radius:12px;padding:10px;margin:8px 0;font-size:14px}.giriskutu{background:#1e293b;border-radius:22px;padding:22px;text-align:center;margin-top:40px}.geri{display:block;text-align:center;margin-top:12px;color:#cbd5e1;text-decoration:none}
</style></head><body><div class="wrap">
<div id="girisEkrani" class="giriskutu"><h2>🔒 Admin Paneli</h2><p style="color:#94a3b8">Sadece sana özel kanka, başkası giremez.</p><input id="adminSifre" type="password" placeholder="Admin şifresi"><button class="menubtn" onclick="adminGiris()">Admin Girişi Yap</button><p id="girisHata" style="color:#fda4af"></p><p style="font-size:12px;color:#64748b">Demo şifre: admin123</p></div>
<div id="panel" style="display:none"><h2 style="text-align:center">👑 Admin Paneli</h2><p style="text-align:center;color:#94a3b8">Hoş geldin Ramazan</p>
<button class="bakim aktif" id="bakimBtn" onclick="bakimDegistir()">🟢 SİTE AKTİF</button><p id="bakimYazi" style="text-align:center;color:#86efac;font-size:13px">Site herkese açık</p>
<button class="menubtn" onclick="bolumAc('kullanicilar')">👥 Kullanıcılar (<span id="kullaniciSayi">0</span>)</button>
<button class="menubtn menubtn2" onclick="bolumAc('sohbet')">💬 Sohbet (<span id="sohbetSayi">0</span>)</button>
<button class="menubtn menubtn3" onclick="bolumAc('bakiye')">🪙 Bakiye İstekleri (<span id="bakiyeSayi">0</span>)</button>
<div id="kullanicilar" class="card bolum acik"><h3>👥 Kullanıcılar</h3><div id="kullaniciListe"></div></div>
<div id="sohbet" class="card bolum"><h3>💬 Destek Sohbet</h3><div id="sohbetListe"></div></div>
<div id="bakiye" class="card bolum"><h3>🪙 Coin Alma / Verme İstekleri</h3><div id="bakiyeListe"></div></div>
<a class="geri" href="anasayfa.html">← Ana Sayfaya Dön</a></div></div>
<script>
var bakim=localStorage.getItem('coin_bakim')==='1';
function adminGiris(){var s=document.getElementById('adminSifre').value;if(s==='admin123'){document.getElementById('girisEkrani').style.display='none';document.getElementById('panel').style.display='block';yenile();}else{document.getElementById('girisHata').textContent='Yanlış şifre kanka!';}}
function bakimDegistir(){bakim=!bakim;localStorage.setItem('coin_bakim',bakim?'1':'0');bakimGoster();}
function bakimGoster(){var b=document.getElementById('bakimBtn');if(bakim){b.textContent='🔴 SİTE BAKIMDA';b.className='bakim bakimda';document.getElementById('bakimYazi').textContent='Site bakımda, hiçbir kullanıcı giremiyor';document.getElementById('bakimYazi').style.color='#fca5a5';}else{b.textContent='🟢 SİTE AKTİF';b.className='bakim aktif';document.getElementById('bakimYazi').textContent='Site herkese açık';document.getElementById('bakimYazi').style.color='#86efac';}}
function bolumAc(id){['kullanicilar','sohbet','bakiye'].forEach(function(x){document.getElementById(x).classList.remove('acik');});document.getElementById(id).classList.add('acik');}
function yenile(){
bakimGoster();
var u={};try{u=JSON.parse(localStorage.getItem('coin_users')||'{}')}catch(e){}
var aktif=localStorage.getItem('coin_aktif');
var isimler=Object.keys(u);document.getElementById('kullaniciSayi').textContent=isimler.length;
var liste=document.getElementById('kullaniciListe');
if(isimler.length===0){liste.innerHTML='<p style="color:#94a3b8">Henüz kullanıcı yok.</p>';}else{liste.innerHTML=isimler.map(function(k){var usr=u[k];var online=aktif===k;return '<div class="kullanici"><div><span class="nokta '+(online?'yesil':'kirmizi')+'"></span> <b>'+k+'</b> <span style="color:#94a3b8">- '+(usr.adsoyad||'İsim yok')+'</span><br><span style="color:#facc15">🪙 '+(usr.bakiye||0)+' COIN</span> <span style="color:#c4b5fd">⭐ Seviye '+(usr.seviye||1)+'</span></div><div><input id="miktar-'+k+'" type="number" placeholder="Coin" style="width:90px;display:inline-block"><button class="kucukbtn ekle" onclick="coinEkle(\''+k+'\')">+ Yükle</button><button class="kucukbtn cikar" onclick="coinCikar(\''+k+'\')">- Çek</button></div></div>';}).join('');}
var destek=[];try{destek=JSON.parse(localStorage.getItem('coin_destek')||'[]')}catch(e){}
document.getElementById('sohbetSayi').textContent=destek.length;
document.getElementById('sohbetListe').innerHTML=destek.length===0?'<p style="color:#94a3b8">Henüz destek mesajı yok.</p>':destek.slice().reverse().map(function(m){return '<div class="mesaj"><b>'+(m.kadi||'Kullanıcı')+'</b> <span style="color:#94a3b8">'+(m.tarih||'')+'</span><br>'+m.mesaj+'</div>';}).join('');
var talepler=[];try{talepler=JSON.parse(localStorage.getItem('coin_talepler')||'[]')}catch(e){}
document.getElementById('bakiyeSayi').textContent=talepler.length;
document.getElementById('bakiyeListe').innerHTML=talepler.length===0?'<p style="color:#94a3b8">Henüz bakiye isteği yok.</p>':talepler.map(function(t,i){return '<div class="mesaj"><b>'+(t.tip==='yukle'?'⬆️ Coin Yükleme':'⬇️ Coin Çekme')+'</b> - '+(t.kadi||'')+' - '+t.tutar+' COIN<br><span style="color:#94a3b8">'+(t.adsoyad||'')+' - '+(t.tarih||'')+'</span><br><button class="kucukbtn onayla" onclick="talepOnayla('+i+')">Onayla</button><button class="kucukbtn reddet" onclick="talepReddet('+i+')">Reddet</button></div>';}).join('');
}
function coinEkle(k){var u=JSON.parse(localStorage.getItem('coin_users')||'{}');var m=Number(document.getElementById('miktar-'+k).value||0);if(!m){alert('Miktar yaz kanka');return;}u[k].bakiye=(u[k].bakiye||0)+m;localStorage.setItem('coin_users',JSON.stringify(u));yenile();alert(k+' hesabına '+m+' COIN yüklendi');}
function coinCikar(k){var u=JSON.parse(localStorage.getItem('coin_users')||'{}');var m=Number(document.getElementById('miktar-'+k).value||0);if(!m){alert('Miktar yaz kanka');return;}u[k].bakiye=Math.max(0,(u[k].bakiye||0)-m);localStorage.setItem('coin_users',JSON.stringify(u));yenile();alert(k+' hesabından '+m+' COIN çekildi');}
function talepOnayla(i){var talepler=JSON.parse(localStorage.getItem('coin_talepler')||'[]');var u=JSON.parse(localStorage.getItem('coin_users')||'{}');var t=talepler[i];if(t&&u[t.kadi]){if(t.tip==='yukle'){u[t.kadi].bakiye=(u[t.kadi].bakiye||0)+Number(t.tutar);}else{u[t.kadi].bakiye=Math.max(0,(u[t.kadi].bakiye||0)-Number(t.tutar));}localStorage.setItem('coin_users',JSON.stringify(u));}talepler.splice(i,1);localStorage.setItem('coin_talepler',JSON.stringify(talepler));yenile();}
function talepReddet(i){var talepler=JSON.parse(localStorage.getItem('coin_talepler')||'[]');talepler.splice(i,1);localStorage.setItem('coin_talepler',JSON.stringify(talepler));yenile();}
</script></body></html>
