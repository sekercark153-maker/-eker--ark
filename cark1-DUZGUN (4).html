<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>1. Cark DUZGUN</title><style>
*{box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#ffe4f1,#fff7d6,#d9f9ff,#ffe4f1);padding:16px}
header{display:flex;justify-content:space-between;align-items:center;max-width:800px;margin:0 auto 16px}header button{background:white;border:2px solid #ffd1e3;padding:10px 14px;border-radius:999px;font-weight:800;color:#7a2e5a;cursor:pointer}.bakiye{background:#7ee8a2;color:#064e2b;padding:10px 16px;border-radius:999px;font-weight:900;border:3px solid white}
.wrap{max-width:480px;margin:0 auto;text-align:center;background:white;border-radius:28px;padding:20px;border:3px solid #ffb3d1}
.wheelbox{position:relative;width:300px;height:300px;margin:10px auto}.ok{position:absolute;top:-6px;left:50%;transform:translateX(-50%);z-index:5;font-size:32px}canvas{width:300px;height:300px;border-radius:50%;border:4px solid white}
.cev{width:100%;background:#ff2e63;color:white;border:none;padding:16px;border-radius:16px;font-size:19px;font-weight:900;cursor:pointer;margin-top:10px}.geri{width:100%;background:#ffe4f1;color:#7a2e5a;border:none;padding:13px;border-radius:16px;font-weight:900;cursor:pointer;margin-top:10px}#sonuc{min-height:28px;font-weight:900;margin:10px 0;font-size:17px}
</style></head><body>
<header><button onclick="location.href='anasayfa.html'">← Ana Sayfaya Dön</button><div class="bakiye">🪙 <span id="bakiye">100</span> COIN</div></header>
<div class="wrap"><div style="background:#22c55e;color:white;padding:8px 12px;border-radius:999px;font-size:13px;font-weight:900;display:inline-block">✅ DUZGUN DOSYA - PEMBE - YENİ</div><h2 style="color:#7a2e5a;margin:10px 0 0">1. Çark - 10 COIN</h2>
<div class="wheelbox"><div class="ok">🔻</div><canvas id="cark" width="600" height="600"></canvas></div>
<div id="sonuc"></div>
<button class="cev" id="cevirBtn" onclick="cevir()">ÇEVİR - 10 COIN</button><button class="geri" onclick="location.href='anasayfa.html'">Ana Sayfaya Dön</button></div>
<script>
var FIYAT=10;var BOLUM=[1,5,10,20,50,100,1,5,10,20,1,5,10,20,50,100,1,5,10,20];
var RENK={1:'#fde68a',5:'#a7f3d0',10:'#e9d5ff',20:'#bfdbfe',50:'#fda4af',100:'#ff2e63'};
var canvas=document.getElementById('cark');var ctx=canvas.getContext('2d');var aci=0;
function ciz(){ctx.clearRect(0,0,600,600);ctx.save();ctx.translate(300,300);ctx.rotate(aci);for(var i=0;i<20;i++){var s=i*18*Math.PI/180;var e=(i+1)*18*Math.PI/180;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,290,s,e);ctx.closePath();ctx.fillStyle=RENK[BOLUM[i]];ctx.fill();ctx.strokeStyle='white';ctx.lineWidth=3;ctx.stroke();ctx.save();ctx.rotate(s+9*Math.PI/180);ctx.fillStyle=(BOLUM[i]===100?'white':'#7a2e5a');ctx.font='900 34px Arial';ctx.textAlign='right';ctx.fillText(BOLUM[i],265,12);ctx.restore();}ctx.beginPath();ctx.arc(0,0,62,0,Math.PI*2);ctx.fillStyle='white';ctx.fill();ctx.strokeStyle='#ffb3d1';ctx.lineWidth=4;ctx.stroke();ctx.fillStyle='#ff2e63';ctx.font='900 36px Arial';ctx.textAlign='center';ctx.fillText('🍬',0,13);ctx.restore();}
ciz();
var bakiye=100;function guncelle(){document.getElementById('bakiye').textContent=bakiye;}
function odulSec(){var agirlik=[[1,99],[5,85],[10,75],[20,60],[50,5],[100,0.1]];var toplam=99+85+75+60+5+0.1;var r=Math.random()*toplam;var birikim=0;for(var i=0;i<agirlik.length;i++){birikim+=agirlik[i][1];if(r<birikim) return agirlik[i][0];}return 1;}
var donuyor=false;
function cevir(){if(donuyor) return;if(bakiye<FIYAT){document.getElementById('sonuc').textContent='Bakiyen yetersiz!';document.getElementById('sonuc').style.color='#e11d48';return;}bakiye-=FIYAT;guncelle();document.getElementById('sonuc').textContent='Çark dönüyor...';donuyor=true;document.getElementById('cevirBtn').disabled=true;var hedefOdul=odulSec();var adaylar=[];for(var i=0;i<20;i++){if(BOLUM[i]===hedefOdul) adaylar.push(i);}var hedefBolum=adaylar[Math.floor(Math.random()*adaylar.length)];var hedefAci=(270-(hedefBolum*18+9))%360;if(hedefAci<0) hedefAci+=360;var baslangic=aci*180/Math.PI%360;if(baslangic<0) baslangic+=360;var fark=(hedefAci-baslangic+360)%360;var toplamDonus=720+fark;var sure=1100;var t0=performance.now();function anim(t){var p=Math.min(1,(t-t0)/sure);var eased=1-Math.pow(1-p,2);aci=(baslangic+toplamDonus*eased)*Math.PI/180;ciz();if(p<1){requestAnimationFrame(anim);}else{bakiye+=hedefOdul;guncelle();var net=hedefOdul-FIYAT;if(net>=0){document.getElementById('sonuc').textContent='🎉 '+hedefOdul+' COIN kazandın! (Net: +'+net+')';document.getElementById('sonuc').style.color='#16a34a';}else{document.getElementById('sonuc').textContent=hedefOdul+' COIN geldi, net: '+net+' COIN';document.getElementById('sonuc').style.color='#e11d48';}donuyor=false;document.getElementById('cevirBtn').disabled=false;}}requestAnimationFrame(anim);}
</script></body></html>
