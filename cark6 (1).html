olor:#cbd5e1">Lütfen daha sonra tekrar dene kanka</div></div>
<header><button onclick="location.href='carklar.html'">← Çarklara Dön</button><div class="bakiye">🪙 <span id="bakiye">-</span> COIN</div></header>
<div class="wrap"><h2 style="color:#7a2e5a;margin:10px 0 0">6. Çark - 1000 COIN</h2>
<div class="wheelbox"><div class="ok">🔻</div><canvas id="cark" width="600" height="600"></canvas></div>
<div id="sonuc"></div>
<button class="cev" id="cevirBtn" onclick="cevir()">ÇEVİR - 1000 COIN</button><button class="geri" onclick="location.href='carklar.html'">Çarklara Dön</button></div>
<script>
var FIYAT=1000;var BOLUM=[250,1000,5000,500,2000,10000,250,1000,5000,500,2000,250,1000,5000,500,2000,10000,250,1000,500];
var RENK={250:'#fde68a',500:'#a7f3d0',1000:'#e9d5ff',2000:'#bfdbfe',5000:'#fda4af',10000:'#ff2e63'};
var canvas=document.getElementById('cark');var ctx=canvas.getContext('2d');var aci=0;
function ciz(){ctx.clearRect(0,0,600,600);ctx.save();ctx.translate(300,300);ctx.rotate(aci);for(var i=0;i<20;i++){var s=i*18*Math.PI/180;var e=(i+1)*18*Math.PI/180;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,290,s,e);ctx.closePath();ctx.fillStyle=RENK[BOLUM[i]];ctx.fill();ctx.strokeStyle='white';ctx.lineWidth=3;ctx.stroke();ctx.save();ctx.rotate(s+9*Math.PI/180);ctx.fillStyle=(BOLUM[i]===10000?'white':'#7a2e5a');ctx.font='900 34px Arial';ctx.textAlign='right';ctx.fillText(BOLUM[i],265,12);ctx.restore();}ctx.beginPath();ctx.arc(0,0,62,0,Math.PI*2);ctx.fillStyle='white';ctx.fill();ctx.strokeStyle='#ffb3d1';ctx.lineWidth=4;ctx.stroke();ctx.fillStyle='#ff2e63';ctx.font='900 36px Arial';ctx.textAlign='center';ctx.fillText('🍬',0,13);ctx.restore();}
ciz();
var bakiye=0;var SON_BAKIYE=null;function guncelle(){if(SON_BAKIYE!==null){document.getElementById('bakiye').textContent=SON_BAKIYE;}}function bakiyeDinle(){if(window._bakiyeListenerKuruldu) return; window._bakiyeListenerKuruldu=true; var kadi=localStorage.getItem('coin_aktif');if(!kadi) return; document.getElementById('bakiye').textContent='-'; if(typeof db!=='undefined'&&db){db.ref('coin_users/'+kadi+'/bakiye').on('value',function(s){var v=s.val();if(v!==null){SON_BAKIYE=v;bakiye=v;document.getElementById('bakiye').textContent=v;try{var u2=JSON.parse(localStorage.getItem('coin_users')||'{}');if(!u2[kadi]) u2[kadi]={};u2[kadi].bakiye=v;localStorage.setItem('coin_users',JSON.stringify(u2));}catch(e){}}});}}function bakimKontrol(){
  try{var o0=document.getElementById('bakimOverlay'); if(o0){o0.style.display='none'; document.body.style.overflow='';}}catch(e){}if(typeof db==='undefined'||!db) return;db.ref('coin_bakim').on('value', function(s){var v=s.val(); var ov=document.getElementById('bakimOverlay'); if(!ov) return;if(v==='1'||v===1||v===true){ov.style.display='flex'; localStorage.setItem('coin_bakim','1'); document.body.style.overflow='hidden';}else{ov.style.display='none'; localStorage.setItem('coin_bakim','0'); document.body.style.overflow='';}});}bakimKontrol();bakiyeDinle();
function seviyeGerekli(seviye){return 100*Math.pow(2,seviye-1);}function odulHesapla(seviye){return Math.round(seviyeGerekli(seviye)*0.1);}
function seviyeKontrol(){
  var kadi=localStorage.getItem('coin_aktif'); if(!kadi) return;
  if(typeof db==='undefined'||!db) return;
  db.ref('coin_users/'+kadi).once('value', function(s){
    var v=s.val(); if(!v) return;
    var seviye=v.seviye||1; var toplamHarcama=v.harcama||0; var toplamOdul=0; var yeniSeviye=seviye;
    var _gosterildi=Math.max(Number(localStorage.getItem('coin_seviye_popup_'+kadi)||0), Number(v.popupSeviye||0));
    while(toplamHarcama>=seviyeGerekli(seviye)){seviye++; var od=odulHesapla(seviye); toplamOdul+=od; yeniSeviye=seviye; if(yeniSeviye>100) break;}
    if(toplamOdul>0){
      db.ref('coin_users/'+kadi+'/seviye').set(yeniSeviye);
      db.ref('coin_users/'+kadi).update({popupSeviye:yeniSeviye});
      try{localStorage.setItem('coin_seviye_popup_'+kadi, String(yeniSeviye));}catch(e){}
      db.ref('coin_users/'+kadi+'/bakiye').transaction(function(cur){return (cur||0)+toplamOdul;});
      try{if(yeniSeviye>_gosterildi && !window._seviyePopupBuSayfadaGosterildi){window._seviyePopupBuSayfadaGosterildi=true;document.getElementById('seviyePopupYazi').textContent='Yeni Seviyen: '+yeniSeviye;document.getElementById('seviyePopupOdul').textContent='Ödülün: '+toplamOdul+' COIN';document.getElementById('seviyePopup').style.display='flex';}}catch(e){}
    }
  });
}

function odulSec(){var agirlik=[[250,90],[500,80],[1000,50],[2000,20],[5000,1],[10000,0]];var toplam=90+80+50+35+10+1;var r=Math.random()*toplam;var birikim=0;for(var i=0;i<agirlik.length;i++){birikim+=agirlik[i][1];if(r<birikim) return agirlik[i][0];}return 1;}
var donuyor=false;
function cevir(){if(donuyor) return;if(SON_BAKIYE===null){document.getElementById('sonuc').textContent='Bakiye yükleniyor, bir saniye bekle kanka';document.getElementById('sonuc').style.color='#e11d48';return;}if((SON_BAKIYE!==null?SON_BAKIYE:bakiye)<FIYAT){document.getElementById('sonuc').textContent='Bakiyen yetersiz!';document.getElementById('sonuc').style.color='#e11d48';return;}SON_BAKIYE=Math.max(0,(SON_BAKIYE!==null?SON_BAKIYE:bakiye)-FIYAT);bakiye=SON_BAKIYE;document.getElementById('bakiye').textContent=SON_BAKIYE;if(typeof db!=='undefined'&&db){db.ref('coin_users/'+localStorage.getItem('coin_aktif')+'/bakiye').transaction(function(cur){return Math.max(0,(cur||0)-FIYAT);});var _k=localStorage.getItem('coin_aktif');db.ref('coin_users/'+_k+'/harcama').transaction(function(cur){return (cur||0)+FIYAT;});db.ref('coin_users/'+_k+'/harcamaSeviyeIcin').transaction(function(cur){return (cur||0)+FIYAT;});setTimeout(seviyeKontrol, 800);}document.getElementById('sonuc').textContent='Çark dönüyor...';donuyor=true;document.getElementById('cevirBtn').disabled=true;var hedefOdul=odulSec();var adaylar=[];for(var i=0;i<20;i++){if(BOLUM[i]===hedefOdul) adaylar.push(i);}var hedefBolum=adaylar[Math.floor(Math.random()*adaylar.length)];var hedefAci=(270-(hedefBolum*18+9))%360;if(hedefAci<0) hedefAci+=360;var baslangic=aci*180/Math.PI%360;if(baslangic<0) baslangic+=360;var fark=(hedefAci-baslangic+360)%360;var toplamDonus=1440+fark;var sure=4500;var t0=performance.now();function anim(t){var p=Math.min(1,(t-t0)/sure);var eased=1-Math.pow(1-p,4);aci=(baslangic+toplamDonus*eased)*Math.PI/180;ciz();if(p<1){requestAnimationFrame(anim);}else{SON_BAKIYE=(SON_BAKIYE!==null?SON_BAKIYE:bakiye)+hedefOdul;bakiye=SON_BAKIYE;document.getElementById('bakiye').textContent=SON_BAKIYE;if(typeof db!=='undefined'&&db){db.ref('coin_users/'+localStorage.getItem('coin_aktif')+'/bakiye').transaction(function(cur){return (cur||0)+hedefOdul;});setTimeout(seviyeKontrol, 800);}var net=hedefOdul-FIYAT;if(net>=0){document.getElementById('sonuc').textContent='🎉 '+hedefOdul+' COIN kazandın! (Net: +'+net+')';document.getElementById('sonuc').style.color='#16a34a';}else{document.getElementById('sonuc').textContent=hedefOdul+' COIN geldi, net: '+net+' COIN';document.getElementById('sonuc').style.color='#e11d48';}donuyor=false;document.getElementById('cevirBtn').disabled=false;}}requestAnimationFrame(anim);}
</script>
<script>
// SILINEN HESAP KONTROLU - admin silerse aninda kayit sayfasina at, hesap komple sifirlanir
(function(){try{var kadi=localStorage.getItem('coin_aktif');if(!kadi)return;var _dene=setInterval(function(){try{if(typeof db==='undefined'||!db)return;clearInterval(_dene);
db.ref('coin_kick/'+kadi).on('value',function(s){if(s.val()!==null){try{var u=JSON.parse(localStorage.getItem('coin_users')||'{}');delete u[kadi];localStorage.setItem('coin_users',JSON.stringify(u));}catch(e){}localStorage.removeItem('coin_aktif');try{db.ref('coin_kick/'+kadi).remove();}catch(e){}alert('Hesabın admin tarafından silindi kanka');if(location.href.indexOf('index.html')===-1){location.href='index.html';}}});
setTimeout(function(){try{db.ref('coin_users/'+kadi).once('value',function(s){if(s.val()===null){try{db.ref('coin_kick/'+kadi).once('value',function(ks){if(ks.val()!==null){try{var u2=JSON.parse(localStorage.getItem('coin_users')||'{}');delete u2[kadi];localStorage.setItem('coin_users',JSON.stringify(u2));}catch(e){}localStorage.removeItem('coin_aktif');try{db.ref('coin_kick/'+kadi).remove();}catch(e){}alert('Hesabın admin tarafından silindi kanka');if(location.href.indexOf('index.html')===-1){location.href='index.html';}}});}catch(e){}});});}catch(e){}},4000);
}catch(e){clearInterval(_dene);}},500);}catch(e){}})();
