<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Coin Çek</title><style>
*{box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#ffe4f1,#fff7d6,#d9f9ff);padding:16px}.wrap{max-width:480px;margin:0 auto}.card{background:white;border-radius:26px;padding:22px;border:3px solid #ffb3d1;margin-top:14px}h2{text-align:center;color:#7a2e5a;margin:4px 0}.bakiye{text-align:center;font-size:22px;font-weight:900;color:#ff2e63}label{display:block;font-weight:800;color:#7a2e5a;margin:12px 0 6px;font-size:14px}input{width:100%;padding:13px;border-radius:14px;border:2px solid #ffd1e3;font-size:15px}.zorunlu{color:#e11d48}.btn{width:100%;background:#ffd166;color:#7a2e00;border:none;padding:15px;border-radius:16px;font-weight:900;font-size:17px;cursor:pointer;margin-top:16px}.geri{display:block;text-align:center;margin-top:14px;background:white;padding:12px;border-radius:999px;text-decoration:none;color:#7a2e5a;font-weight:800;border:2px solid #ffd1e3}
</style></head><body><div class="wrap"><div style="display:flex;gap:10px;margin-bottom:10px"><a href="yukle.html" style="flex:1;text-align:center;background:#7ee8a2;color:#064e2b;padding:13px;border-radius:14px;text-decoration:none;font-weight:900">⬆️ COIN YÜKLE</a><a href="cekme.html" style="flex:1;text-align:center;background:#ffd166;color:#7a2e00;padding:13px;border-radius:14px;text-decoration:none;font-weight:900">⬇️ COIN ÇEK</a></div><h2>⬇️ Coin Çek</h2><div class="card"><div class="bakiye">Mevcut: <span id="bakiye">100</span> COIN</div>
<label>Coin Hesap Numarası <span class="zorunlu">*</span></label><input id="hesap" placeholder="Coin hesap numaranı yaz">
<label>İsim Soyisim <span class="zorunlu">*</span></label><input id="adsoyad" placeholder="İsim Soyisim">
<label>Kaç COIN çekeceksin? <span class="zorunlu">*</span></label><input id="tutar" type="number" placeholder="Örn: 500">
<label>Kullanıcı Adın <span class="zorunlu">*</span></label><input id="kadi" placeholder="Kullanıcı adını yaz">
<button class="btn" onclick="gonder()">Çekim Talebi Gönder</button><p id="sonuc" style="text-align:center;font-weight:800"></p>
</div><a class="geri" href="anasayfa.html">← Ana Sayfaya Dön</a></div>
<script>
var ad=localStorage.getItem('coin_aktif');var u={};try{u=JSON.parse(localStorage.getItem('coin_users')||'{}')}catch(e){}
if(ad&&u[ad]){document.getElementById('bakiye').textContent=u[ad].bakiye;document.getElementById('kadi').value=ad;}
function gonder(){var hesap=document.getElementById('hesap').value.trim();var adsoyad=document.getElementById('adsoyad').value.trim();var tutar=document.getElementById('tutar').value;var kadi=document.getElementById('kadi').value.trim();var s=document.getElementById('sonuc');if(!hesap||!adsoyad||!tutar||!kadi){s.style.color='#e11d48';s.textContent='Kanka her yer zorunlu!';return;}if(ad&&u[ad]&&u[ad].bakiye<Number(tutar)){s.style.color='#e11d48';s.textContent='Bakiyen yetersiz!';return;}var talepler=[];try{talepler=JSON.parse(localStorage.getItem('coin_talepler')||'[]')}catch(e){}talepler.push({tip:'cek',hesap:hesap,adsoyad:adsoyad,tutar:tutar,kadi:kadi,tarih:new Date().toLocaleString('tr-TR')});localStorage.setItem('coin_talepler',JSON.stringify(talepler));s.style.color='#16a34a';s.textContent='Çekim talebin alındı! Admin onaylayınca '+tutar+' COIN çekilecek.';}
</script></body></html>
