<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Coin Çek</title><style>
*{box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#ffe4f1,#fff7d6,#d9f9ff);padding:16px}.wrap{max-width:480px;margin:0 auto}.card{background:white;border-radius:26px;padding:22px;border:3px solid #ffb3d1;margin-top:14px}h2{text-align:center;color:#7a2e5a;margin:4px 0}.bakiye{text-align:center;font-size:22px;font-weight:900;color:#ff2e63}label{display:block;font-weight:800;color:#7a2e5a;margin:12px 0 6px;font-size:14px}input{width:100%;padding:13px;border-radius:14px;border:2px solid #ffd1e3;font-size:15px}.zorunlu{color:#e11d48}.btn{width:100%;background:#ffd166;color:#7a2e00;border:none;padding:15px;border-radius:16px;font-weight:900;font-size:17px;cursor:pointer;margin-top:16px}.geri{display:block;text-align:center;margin-top:14px;background:white;padding:12px;border-radius:999px;text-decoration:none;color:#7a2e5a;font-weight:800;border:2px solid #ffd1e3}
</style><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script><script>const firebaseConfig={apiKey:"AIzaSyD8WfOZ-JmuVZkisaK7rcpLqvYGyhPSN9o",authDomain:"coin-arena-3f0f9.firebaseapp.com",databaseURL:"https://coin-arena-3f0f9-default-rtdb.europe-west1.firebasedatabase.app",projectId:"coin-arena-3f0f9",storageBucket:"coin-arena-3f0f9.firebasestorage.app",messagingSenderId:"541797577041",appId:"1:541797577041:web:9378f7ccbda8857946a370"}; if(typeof firebase!=='undefined' && !firebase.apps.length){firebase.initializeApp(firebaseConfig);} const db=(typeof firebase!=='undefined')?firebase.database():null;</script></head><body><div id="bakimOverlay" style="display:none;position:fixed;inset:0;background:#000;z-index:99999;align-items:center;justify-content:center;text-align:center;color:white;font-size:26px;font-weight:900;padding:20px;flex-direction:column;gap:12px;touch-action:none"><div style="font-size:60px">🔧</div><div>SİTE ŞU ANDA BAKIMDA</div><div style="font-size:15px;font-weight:400;color:#cbd5e1">Lütfen daha sonra tekrar dene kanka</div></div><div class="wrap"><div style="display:flex;gap:10px;margin-bottom:10px"><a href="yukle.html" style="flex:1;text-align:center;background:#7ee8a2;color:#064e2b;padding:13px;border-radius:14px;text-decoration:none;font-weight:900">⬆️ COIN YÜKLE</a><a href="cekme.html" style="flex:1;text-align:center;background:#ffd166;color:#7a2e00;padding:13px;border-radius:14px;text-decoration:none;font-weight:900">⬇️ COIN ÇEK</a></div><h2>⬇️ Coin Çek</h2><div class="card"><div class="bakiye">Mevcut: <span id="bakiye">100</span> COIN</div>
<label>Coin Hesap Numarası <span class="zorunlu">*</span></label><input id="hesap" placeholder="Coin hesap numaranı yaz">
<label>İsim Soyisim <span class="zorunlu">*</span></label><input id="adsoyad" placeholder="İsim Soyisim">
<label>Kaç COIN çekeceksin? <span class="zorunlu">*</span></label><div style="font-size:12px;color:#9a5a7a;margin-bottom:6px">En az 100 COIN - En fazla 1.000 COIN</div><input id="tutar" type="number" min="100" max="1000" placeholder="100 - 1000 arası yaz">
<label>Kullanıcı Adın <span class="zorunlu">*</span></label><input id="kadi" placeholder="Kullanıcı adını yaz">
<button class="btn" onclick="gonder()">Çekim Talebi Gönder</button><p id="sonuc" style="text-align:center;font-weight:800"></p>
</div><a class="geri" href="anasayfa.html">← Ana Sayfaya Dön</a></div>
<script>
var ad=localStorage.getItem('coin_aktif');var u={};try{u=JSON.parse(localStorage.getItem('coin_users')||'{}')}catch(e){}
if(ad&&u[ad]){document.getElementById('bakiye').textContent=u[ad].bakiye;document.getElementById('kadi').value=ad;}
function gonder(){var hesap=document.getElementById('hesap').value.trim();var adsoyad=document.getElementById('adsoyad').value.trim();var tutar=document.getElementById('tutar').value;var kadi=document.getElementById('kadi').value.trim();var s=document.getElementById('sonuc');if(!hesap||!adsoyad||!tutar||!kadi){s.style.color='#e11d48';s.textContent='Kanka her yer zorunlu!';return;}if(Number(tutar)<100){s.style.color='#e11d48';s.textContent='En az 100 COIN çekebilirsin kanka!';return;}if(Number(tutar)>1000){s.style.color='#e11d48';s.textContent='En fazla 1.000 COIN çekebilirsin kanka!';return;}if(ad&&u[ad]&&u[ad].bakiye<Number(tutar)){s.style.color='#e11d48';s.textContent='Bakiyen yetersiz!';return;}var talepler=[];try{talepler=JSON.parse(localStorage.getItem('coin_talepler')||'[]')}catch(e){}talepler.push({tip:'cek',hesap:hesap,adsoyad:adsoyad,tutar:tutar,kadi:kadi,tarih:new Date().toLocaleString('tr-TR')});localStorage.setItem('coin_talepler',JSON.stringify(talepler)); if(typeof db!=='undefined' && db){ db.ref('coin_talepler').push({tip:'cek',hesap:hesap,adsoyad:adsoyad,tutar:tutar,kadi:kadi,tarih:new Date().toLocaleString('tr-TR')}); db.ref('coin_islemler').push({tip:'⬇️ Coin Çekme Talebi',kadi:kadi,detay:tutar+' COIN',tarih:new Date().toLocaleString('tr-TR')}); } s.style.color='#16a34a';s.textContent='Çekim talebin alındı! Admin onaylayınca '+tutar+' COIN çekilecek.';}

function bakiyeCanli(){ var kadi=localStorage.getItem('coin_aktif'); if(!kadi) return; if(typeof db!=='undefined' && db){ db.ref('coin_users/'+kadi).on('value', function(s){ var v=s.val(); if(!v) return; var el=document.getElementById('bakiye'); if(el) el.textContent=v.bakiye||0; try{ var u=JSON.parse(localStorage.getItem('coin_users')||'{}'); if(u[kadi]){u[kadi].bakiye=v.bakiye||0; if(v.seviye) u[kadi].seviye=v.seviye; localStorage.setItem('coin_users',JSON.stringify(u)); if(typeof goster==='function'){ try{goster();}catch(e){} } } }catch(e){} }); } } setTimeout(bakiyeCanli, 300);

function bakimKontrol(){
  try{if(localStorage.getItem('coin_bakim')==='1'){var o0=document.getElementById('bakimOverlay'); if(o0){o0.style.display='flex'; document.body.style.overflow='hidden';}}}catch(e){}
  if(typeof db==='undefined'||!db) return;
  db.ref('coin_bakim').on('value', function(s){
    var v=s.val(); var ov=document.getElementById('bakimOverlay'); if(!ov) return;
    if(v==='1'||v===1||v===true){ov.style.display='flex'; localStorage.setItem('coin_bakim','1'); document.body.style.overflow='hidden';}
    else{ov.style.display='none'; localStorage.setItem('coin_bakim','0'); document.body.style.overflow='';}
  });
}
bakimKontrol();
</script>
<script>
// SILINEN HESAP KONTROLU - admin silerse aninda kayit sayfasina at, hesap komple sifirlanir
(function(){try{var kadi=localStorage.getItem('coin_aktif');if(!kadi)return;var _dene=setInterval(function(){try{if(typeof db==='undefined'||!db)return;clearInterval(_dene);
db.ref('coin_kick/'+kadi).on('value',function(s){if(s.val()!==null){try{var u=JSON.parse(localStorage.getItem('coin_users')||'{}');delete u[kadi];localStorage.setItem('coin_users',JSON.stringify(u));}catch(e){}localStorage.removeItem('coin_aktif');try{db.ref('coin_kick/'+kadi).remove();}catch(e){}alert('Hesabın admin tarafından silindi kanka');if(location.href.indexOf('index.html')===-1){location.href='index.html';}}});

}catch(e){clearInterval(_dene);}},500);}catch(e){}})();
</script>
</body></html>
