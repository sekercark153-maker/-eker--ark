<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COIN ARENA - Giris</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#0f172a,#1e1b4b,#0f172a);color:white;padding:16px}
.card{background:#1e293b;width:100%;max-width:380px;padding:28px;border-radius:20px;box-shadow:0 20px 50px rgba(0,0,0,.5);text-align:center;border:1px solid #334155}
h1{margin:0;font-size:34px;letter-spacing:2px;color:#facc15}
.sub{color:#cbd5e1;font-size:13px;margin:8px 0 20px}
input{width:100%;padding:13px;border-radius:12px;border:1px solid #475569;background:#0f172a;color:white;margin-bottom:12px;font-size:15px;outline:none}
input:focus{border-color:#facc15}
button{width:100%;padding:13px;border:none;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer;margin-bottom:10px}
.kayit{background:#facc15;color:#111}
.giris{background:#22c55e;color:white}
#mesaj{min-height:22px;font-size:14px;margin-top:6px;color:#fda4af}
.bilgi{font-size:12px;color:#94a3b8;margin-top:10px}
</style>
</head>
<body>
<div class="card">
<h1>COIN ARENA</h1>
<div class="sub">Demo Surum - Gercek Para Kullanilmaz<br>Sadece Sanal Coin</div>
<input id="ad" placeholder="Kullanici Adi">
<input id="sifre" type="password" placeholder="Sifre">
<button class="kayit" onclick="kayit()">KAYIT OL</button>
<button class="giris" onclick="giris()">GIRIS YAP</button>
<div id="mesaj"></div>
<div class="bilgi">Yeniysen Kayit Ol'a bas, hesabın olusur.<br>Kayıt hediyesi: <b style="color:#facc15">100 coin</b></div>
</div>
<script>
function oku(){ try{return JSON.parse(localStorage.getItem('coin_users')||'{}')}catch(e){return {}} }
function yaz(d){ localStorage.setItem('coin_users', JSON.stringify(d)) }
function kayit(){
  var ad=document.getElementById('ad').value.trim();
  var sifre=document.getElementById('sifre').value;
  var m=document.getElementById('mesaj');
  if(!ad||!sifre){ m.textContent='Kullanici adi ve sifre bos olamaz'; return; }
  var u=oku();
  if(u[ad]){ m.textContent='Bu kullanici zaten var, Giris Yap dene'; return; }
  u[ad]={sifre:sifre,bakiye:100,engelli:false};
  yaz(u);
  m.style.color='#86efac';
  m.textContent='Kayit basarili! Hos geldin '+ad+' - Bakiyen: 100 coin';
}
function giris(){
  var ad=document.getElementById('ad').value.trim();
  var sifre=document.getElementById('sifre').value;
  var m=document.getElementById('mesaj');
  if(ad==='admin' && sifre==='admin123'){ m.style.color='#86efac'; m.textContent='Admin girisi basarili'; return; }
  var u=oku();
  if(!u[ad]){ m.textContent='Boyle bir kullanici yok, once Kayit Ol'; return; }
  if(u[ad].sifre!==sifre){ m.textContent='Hatali sifre'; return; }
  if(u[ad].engelli){ m.textContent='Hesabin engelli'; return; }
  m.style.color='#86efac';
  m.textContent='Hos geldin, '+ad+'! Bakiyen: '+u[ad].bakiye+' coin';
}
</script>
</body>
</html>
