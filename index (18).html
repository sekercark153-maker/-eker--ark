<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>COIN ARENA - Tatlı</title><style>
*{box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,#ffe4f1,#fff7d6,#d9f9ff,#e7e0ff);padding:16px;overflow-x:hidden}
.seker{position:fixed;font-size:26px;opacity:.9;pointer-events:none;animation:uc 6s ease-in-out infinite}
@keyframes uc{0%,100%{transform:translateY(0) rotate(-10deg)}50%{transform:translateY(-14px) rotate(10deg)}}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;z-index:2}
.card{background:rgba(255,255,255,.92);width:100%;max-width:420px;padding:28px;border-radius:28px;text-align:center;border:3px solid #ffb3d1;box-shadow:0 12px 30px rgba(255,120,180,.25)}
.odul{background:#ff2e63;color:white;font-size:23px;font-weight:900;padding:13px 8px;border-radius:16px;margin-bottom:16px;box-shadow:0 6px 0 #c9184a}
h1{margin:0 0 18px;font-size:36px;letter-spacing:2px;color:#ff6b9d;text-shadow:2px 2px 0 #fff0a8}
input{width:100%;padding:14px;border-radius:16px;border:2px solid #ffd1e3;background:#fff5f9;color:#4a2545;margin-bottom:12px;font-size:15px}
button{width:100%;padding:14px;border:none;border-radius:16px;font-size:17px;font-weight:900;cursor:pointer;margin-bottom:10px}
.kayit{background:#ffd166;color:#7a2e00}.giris{background:#7ee8a2;color:#064e2b}
#mesaj{min-height:22px;font-size:14px;color:#e11d48;font-weight:700}
.alt{font-size:12px;color:#a07a8a;margin-top:8px}
</style></head><body>
<span class="seker" style="left:6%;top:8%">🍬</span><span class="seker" style="left:88%;top:12%;animation-delay:1s">🍭</span><span class="seker" style="left:12%;top:82%;animation-delay:.5s">🍩</span><span class="seker" style="left:84%;top:78%">🧁</span><span class="seker" style="left:50%;top:4%">🍫</span><span class="seker" style="left:70%;top:88%;animation-delay:1.5s">🍬</span>
<div class="center"><div class="card"><div class="odul">KAYIT ÖDÜLÜ 100 COIN</div><h1>🍭 COIN ARENA 🍬</h1>
<input id="ad" placeholder="Kullanici Adi"><input id="sifre" type="password" placeholder="Sifre">
<button class="kayit" onclick="kayit()">KAYIT OL 🍬</button><button class="giris" onclick="giris()">GIRIS YAP 🍭</button><div id="mesaj"></div><div class="alt">V3 - TATLI TASARIM</div></div></div>
<script>
function oku(){try{return JSON.parse(localStorage.getItem('coin_users')||'{}')}catch(e){return {}}}
function yaz(d){localStorage.setItem('coin_users',JSON.stringify(d))}
function kayit(){var ad=document.getElementById('ad').value.trim();var sifre=document.getElementById('sifre').value;var m=document.getElementById('mesaj');if(!ad||!sifre){m.textContent='Kullanici adi ve sifre bos olamaz';return;}var u=oku();if(u[ad]){m.textContent='Bu kullanici zaten var, Giris Yap dene';return;}u[ad]={sifre:sifre,bakiye:100,engelli:false,seviye:1};yaz(u);var is=[];try{is=JSON.parse(localStorage.getItem('coin_islemler')||'[]')}catch(e){}is.push({tip:'🆕 Kayıt',kadi:ad,detay:'Yeni hesap açtı, 100 COIN hediye',tarih:new Date().toLocaleString('tr-TR')});localStorage.setItem('coin_islemler',JSON.stringify(is));localStorage.setItem('coin_aktif',ad);m.style.color='#16a34a';m.textContent='Kayit basarili! Bakiyen: 100 coin';setTimeout(function(){location.href='anasayfa.html'},600);}
function giris(){var ad=document.getElementById('ad').value.trim();var sifre=document.getElementById('sifre').value;var m=document.getElementById('mesaj');if(!u_check(ad,sifre)){return}var u=oku();localStorage.setItem('coin_aktif',ad);var is2=[];try{is2=JSON.parse(localStorage.getItem('coin_islemler')||'[]')}catch(e){}is2.push({tip:'🔑 Giriş',kadi:ad,detay:'Siteye giriş yaptı',tarih:new Date().toLocaleString('tr-TR')});localStorage.setItem('coin_islemler',JSON.stringify(is2));location.href='anasayfa.html';}
function u_check(ad,sifre){var m=document.getElementById('mesaj');if(ad==='admin'&&sifre==='admin123'){return true;}var u=oku();if(!u[ad]){m.textContent='Boyle bir kullanici yok, once Kayit Ol';return false;}if(u[ad].sifre!==sifre){m.textContent='Hatali sifre';return false;}if(u[ad].engelli){m.textContent='Hesabin engelli';return false;}return true;}
</script></body></html>
