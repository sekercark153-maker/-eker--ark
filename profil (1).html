<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Profil</title><style>
*{box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#ffe4f1,#fff7d6,#d9f9ff,#ffe4f1);padding:16px}.wrap{max-width:480px;margin:0 auto;text-align:center}.card{background:white;border-radius:28px;padding:24px;border:3px solid #ffb3d1;margin-top:14px}.avatar{width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:62px;margin:0 auto;border:4px solid white;box-shadow:0 10px 20px rgba(255,100,170,.3)}.kadi{font-size:24px;font-weight:900;color:#7a2e5a;margin-top:10px}.adsoyad{color:#9a5a7a;font-size:15px;margin-top:4px}.bakiye{font-size:20px;font-weight:900;color:#ff2e63;margin:12px 0}.seviyebox{background:#fff5f9;border:2px solid #ffd1e3;border-radius:18px;padding:14px;margin:14px 0;text-align:left}.seviyebox h3{margin:0 0 8px;color:#7a2e5a}.seviyebar{height:14px;background:#ffe4f1;border-radius:999px;overflow:hidden}.seviyebar div{height:100%;background:linear-gradient(90deg,#ff6b9d,#ffd166);width:0%}.btn{display:block;background:#ffd166;color:#7a2e00;padding:13px;border-radius:14px;text-decoration:none;font-weight:900;margin:10px 0;border:none;width:100%;cursor:pointer;font-size:16px}.btn2{background:#7ee8a2;color:#064e2b}.btn3{background:#e9d5ff;color:#5b21b6}.btn4{background:#ffe4f1;color:#7a2e5a}.gecmis{margin-top:14px;text-align:left;display:none}.islem{background:#fff5f9;border:2px solid #ffd1e3;border-radius:14px;padding:10px;margin:8px 0;font-size:14px}.islem b{color:#7a2e5a}input{width:100%;padding:12px;border-radius:12px;border:2px solid #ffd1e3;margin-top:8px}.geri{display:inline-block;margin-top:12px;background:white;padding:12px 20px;border-radius:999px;text-decoration:none;color:#7a2e5a;font-weight:800;border:2px solid #ffd1e3}
</style></head><body><div class="wrap"><div class="card">
<div class="avatar" id="avatar">🍬</div>
<div class="kadi" id="kadi">Kullanıcı</div>
<div class="adsoyad" id="adsoyad">İsim Soyisim</div>
<div class="bakiye">🪙 <span id="bakiye">100</span> COIN</div>
<input id="adsoyadInput" placeholder="İsim Soyisimini yaz (bir kez)">
<button class="btn btn4" onclick="adsoyadKaydet()">İsim Soyisimi Kaydet</button>
<div class="seviyebox"><h3>⭐ Seviye <span id="seviye">1</span></h3><p style="font-size:14px;color:#7a2e5a;margin:6px 0;font-weight:700" id="seviyeAltYazi">Şu an Seviye 1, sonraki Seviye 2 için 100 COIN harcama gerekli</p><div class="seviyebar"><div id="bar"></div></div><p style="font-size:13px;color:#9a5a7a;margin:8px 0 0">Toplam Harcaman: <b id="harcama" style="color:#ff2e63">0 COIN</b></p><p style="font-size:13px;color:#16a34a;margin:4px 0 0;font-weight:700" id="odulYazi">Seviye 1 Ödülü: 50 COIN</p></div>
<button class="btn btn3" onclick="gecmisAc()">📜 Geçmiş İşlemler</button>
<div class="gecmis" id="gecmis"><h3 style="color:#7a2e5a;margin:0 0 8px">Coin Yükleme & Çekme</h3><div id="islemListe"></div></div>
<a class="btn btn2" href="bakiye.html" style="text-decoration:none">Bakiye Yükle / Çek</a><a class="btn btn4" href="anasayfa.html" style="text-decoration:none">Çarklara Dön</a><button class="btn" onclick="cikis()" style="background:#fee2e2;color:#991b1b">Çıkış Yap</button>
</div><a class="geri" href="anasayfa.html">← Ana Sayfaya Dön</a></div>
<script>
var avatarlar=[{e:'🍬',c:'#ffe4f1'},{e:'🍭',c:'#d9f9ff'},{e:'🍩',c:'#fff7d6'},{e:'🍓',c:'#ffe4e6'},{e:'🍒',c:'#fce7f3'},{e:'🍦',c:'#e0f2fe'},{e:'🧁',c:'#fef3c7'},{e:'🍪',c:'#ffedd5'},{e:'🍰',c:'#ede9fe'},{e:'🍫',c:'#fef9c3'},{e:'🍋',c:'#fefce8'},{e:'🍇',c:'#f3e8ff'}];
var ad=localStorage.getItem('coin_aktif')||'Kullanıcı';
var u={};try{u=JSON.parse(localStorage.getItem('coin_users')||'{}')}catch(e){}
if(!u[ad]){u[ad]={sifre:'',bakiye:100,seviye:1,adsoyad:''};}
document.getElementById('kadi').textContent=ad;
var toplam=0;for(var i=0;i<ad.length;i++){toplam+=ad.charCodeAt(i);}var sec=avatarlar[toplam%avatarlar.length];
document.getElementById('avatar').textContent=sec.e;document.getElementById('avatar').style.background=sec.c;
function goster(){
var bakiye=u[ad].bakiye||0;document.getElementById('bakiye').textContent=bakiye;
var seviye=u[ad].seviye||1;if(!u[ad].harcama) u[ad].harcama=0;if(!u[ad].harcamaSeviyeIcin) u[ad].harcamaSeviyeIcin=0;
// Otomatik seviye atlama - harcadıkça yükselir, her seviye öncekinin 2 katı
var degisti=false;
while(true){var gerekli=100*Math.pow(2,seviye-1);if(u[ad].harcamaSeviyeIcin>=gerekli){u[ad].harcamaSeviyeIcin-=gerekli;seviye++;u[ad].seviye=seviye;var odul=50*seviye;u[ad].bakiye=(u[ad].bakiye||0)+odul;degisti=true;}else{break;}}
if(degisti){localStorage.setItem('coin_users',JSON.stringify(u));bakiye=u[ad].bakiye;document.getElementById('bakiye').textContent=bakiye;}
document.getElementById('seviye').textContent=seviye;
var gerekliSimdi=100*Math.pow(2,seviye-1);
document.getElementById('seviyeAltYazi').textContent='Şu an Seviye '+seviye+', sonraki Seviye '+(seviye+1)+' için '+gerekliSimdi+' COIN harcama gerekli';
document.getElementById('harcama').textContent=(u[ad].harcama||0)+' COIN';
document.getElementById('odulYazi').textContent='Seviye '+seviye+' Ödülü: '+(50*seviye)+' COIN - Seviye atlayınca bakiyene eklenir';
var ilerleme=Math.min(100,Math.floor((u[ad].harcamaSeviyeIcin||0)/gerekliSimdi*100));
document.getElementById('bar').style.width=ilerleme+'%';
if(u[ad].adsoyad){document.getElementById('adsoyad').textContent=u[ad].adsoyad;}
}
function adsoyadKaydet(){var v=document.getElementById('adsoyadInput').value.trim();if(!v){alert('İsim soyisim yaz kanka');return;}u[ad].adsoyad=v;localStorage.setItem('coin_users',JSON.stringify(u));goster();document.getElementById('adsoyadInput').value='';}

function gecmisAc(){var g=document.getElementById('gecmis');g.style.display=g.style.display==='block'?'none':'block';if(g.style.display!=='block')return;var liste=document.getElementById('islemListe');var talepler=[];try{talepler=JSON.parse(localStorage.getItem('coin_talepler')||'[]')}catch(e){}var benim=talepler.filter(function(t){return t.kadi===ad;});if(benim.length===0){liste.innerHTML='<div class="islem">Henüz işlem yok kanka. Bakiye sayfasından yükle / çek yapınca buraya düşecek.</div>';return;}liste.innerHTML=benim.slice().reverse().map(function(t){return '<div class="islem"><b>'+(t.tip==='yukle'?'⬆️ Coin Yükleme':'⬇️ Coin Çekme')+'</b> - '+t.tutar+' COIN<br><span style="color:#9a5a7a">'+(t.tarih||'')+'</span></div>';}).join('');}
function cikis(){localStorage.removeItem('coin_aktif');location.href='index.html';}
goster();
</script></body></html>
