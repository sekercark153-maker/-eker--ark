<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Profil</title><style>
*{box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#ffe4f1,#fff7d6,#d9f9ff);padding:16px}.wrap{max-width:480px;margin:0 auto;text-align:center}.card{background:white;border-radius:26px;padding:24px;border:3px solid #ffb3d1;margin-top:16px}.avatar{font-size:70px}.isim{font-size:24px;font-weight:900;color:#7a2e5a}.bakiye{font-size:20px;font-weight:900;color:#ff2e63;margin:10px 0}.btn{display:block;background:#ffd166;color:#7a2e00;padding:13px;border-radius:14px;text-decoration:none;font-weight:900;margin:10px 0}.btn2{background:#7ee8a2;color:#064e2b}.btn3{background:#ffe4f1;color:#7a2e5a}.geri{display:inline-block;margin-top:10px;background:white;padding:12px 20px;border-radius:999px;text-decoration:none;color:#7a2e5a;font-weight:800;border:2px solid #ffd1e3}
</style></head><body><div class="wrap"><div class="card"><div class="avatar">👤</div><div class="isim" id="isim">Kullanıcı</div><div class="bakiye">🪙 <span id="bakiye">100</span> COIN</div><a class="btn" href="bakiye.html">Bakiye Yükle</a><a class="btn btn2" href="anasayfa.html">Çarklara Dön</a><a class="btn btn3" href="index.html" onclick="localStorage.removeItem('coin_aktif')">Çıkış Yap</a></div><a class="geri" href="anasayfa.html">← Ana Sayfaya Dön</a></div><script>
var ad=localStorage.getItem('coin_aktif');var u={};try{u=JSON.parse(localStorage.getItem('coin_users')||'{}')}catch(e){}

if(ad&&u[ad]){document.getElementById('bakiye').textContent=u[ad].bakiye;}
</script></body></html>
