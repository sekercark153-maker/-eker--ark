}; if(typeof firebase !== 'undefined' && !firebase.apps.length){firebase.initializeApp(firebaseConfig);} const db = (typeof firebase !== 'undefined') ? firebase.database() : null;</script></head><body><div class="wrap"><div style="display:flex;gap:10px;margin-bottom:10px"><a href="yukle.html" style="flex:1;text-align:center;background:#7ee8a2;color:#064e2b;padding:13px;border-radius:14px;text-decoration:none;font-weight:900">⬆️ COIN YÜKLE</a><a href="cekme.html" style="flex:1;text-align:center;background:#ffd166;color:#7a2e00;padding:13px;border-radius:14px;text-decoration:none;font-weight:900">⬇️ COIN ÇEK</a></div><h2>⬆️ Coin Yükle</h2><div class="card"><div class="bakiye">Mevcut: <span id="bakiye">100</span> COIN</div>
<div class="iban"><div style="font-size:13px;color:#9a5a7a">Coin Hesap Numarası</div><b>TR310006701000000025039314</b><div>Ramazan Yıldırım</div><div style="font-size:12px;color:#e11d48;font-weight:700">Coin yüklemek için bu coin hesap numarasına gönder</div></div>

<label>Dekont / Resim At <span class="zorunlu">*</span></label><input id="resim" type="file" accept="image/*"><img id="onizleme">
<label>Kullanıcı Adın <span class="zorunlu">*</span></label><input id="kadi" placeholder="Kullanıcı adını yaz">

<script>
var ad=localStorage.getItem('coin_aktif');var u={};try{u=JSON.parse(localStorage.getItem('coin_users')||'{}')}catch(e){}
if(ad&&u[ad]){document.getElementById('bakiye').textContent=u[ad].bakiye;document.getElementById('kadi').value=ad;}
document.getElementById('resim').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){var img=document.getElementById('onizleme');img.src=ev.target.result;img.style.display='block';};r.readAsDataURL(f);});
function gonder(){var tutar=document.getElementById('tutar').value;var resim=document.getElementById('resim').files.length;var kadi=document.getElementById('kadi').value.trim();var adsoyad=document.getElementById('adsoyad').value.trim();var s=document.getElementById('sonuc');if(!tutar||!resim||!kadi||!adsoyad){s.style.color='#e11d48';s.textContent='Kanka her yer zorunlu! Coin, resim, kullanıcı adı, isim soyisim hepsini doldur.';return;}if(Number(tutar)<100){s.style.color='#e11d48';s.textContent='En az 100 COIN yükleyebilirsin kanka!';return;}if(Number(tutar)>1000){s.style.color='#e11d48';s.textContent='En fazla 1.000 COIN yükleyebilirsin kanka!';return;}var talepler=[];try{talepler=JSON.parse(localStorage.getItem('coin_talepler')||'[]')}catch(e){}talepler.push({tip:'yukle',tutar:tutar,kadi:kadi,adsoyad:adsoyad,tarih:new Date().toLocaleString('tr-TR')});localStorage.setItem('coin_talepler',JSON.stringify(talepler)); var yeniTalep = talepler[talepler.length-1]; if(db){ db.ref('coin_talepler').push(yeniTalep); db.ref('coin_islemler').push({tip:'🪙 Talep',kadi:yeniTalep.kadi,detay:(yeniTalep.tip==='yukle'?'Coin Yükleme':'Coin Çekme')+' - '+yeniTalep.tutar+' COIN',tarih:yeniTalep.tarih}); }s.style.color='#16a34a';s.textContent='Talebin alındı! Admin onaylayınca '+tutar+' COIN yüklenecek.';document.getElementById('tutar').value='';}
</script></body></html>
